name: Prek checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 的 run 串行执行,新 push 取消旧 run(避免并发部署和陈旧文档上线)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: j178/prek-action@v2

  deploy-docs:
    # 排在 hook 检查之后,且只在 push 时部署(PR 只跑 prek)
    if: github.event_name == 'push'
    needs: prek
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build docs with MathJax
        env:
          RUSTDOCFLAGS: --html-in-header mathjax.html
        run: cargo doc --no-deps

      # 新版 rustdoc 不生成根跳转页,补一个让 Pages 根路径自动跳到 crate 页
      - name: Generate root redirect
        run: printf '<meta http-equiv="refresh" content="0; url=algo_rs/index.html">' > target/doc/index.html

      # 每次 run/attempt 用唯一 artifact 名:重跑失败 job 时旧 attempt 的 artifact 不会清理,
      # 同名会触发 deploy-pages 的 "Multiple artifacts named github-pages" 报错
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
